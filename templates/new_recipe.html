<!DOCTYPE html>
<html lang="en">

<head>
  <title>New recipe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>
  <h1>Recipes</h1>
  <p><a href="/">Back</a></p>
  <hr>
  {% if message %}
    <p id="message" class="{{ message_type }}">{{ message }}</p>
  {% endif %}
  <h2>New recipe</h2>
  <form action="{{ url_for('create_recipe') }}" method="post">
    <p>
      Name: <br>
      <input type="text" name="title" maxlength="50" size="50" value="{{ title }}">
    </p>
    <p>
      Description: <br>
      <textarea name="description" rows="8" cols="80" maxlength="1000">{{ description }}</textarea>
    </p>
    <p>
      Ingredients: <br>
      <textarea name="ingredients" rows="4" cols="80" maxlength="1000">{{ ingredients }}</textarea>
    </p>
    <p>
      Instructions: <br>
      <textarea name="instructions" rows="8" cols="80" maxlength="1000">{{ instructions }}</textarea>
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <input type="submit" value="Add recipe">
  </form>
</body>

</html>
