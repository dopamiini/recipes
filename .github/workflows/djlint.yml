name: djLint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install djLint
        run: pip install djlint

      - name: Validate Jinja2 templates
        run: djlint templates/ --lint